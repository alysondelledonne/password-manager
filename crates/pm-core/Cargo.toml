[package]
name = "pm-core"
description = "Core logic for the password manager: the password generator (v0.1). No UI code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
rand_chacha = "0.10.0"
serde_json = "1.0.154"
