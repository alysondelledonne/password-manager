[workspace]
resolver = "3"
members = ["crates/pm-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches Tauri 2's minimum supported Rust version, so the whole workspace builds on one toolchain.
rust-version = "1.90"

[workspace.lints.rust]
# No `unsafe` anywhere in this project's own code.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
